<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裝備預覽</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #16130f; color: #d8cbb4; font: 14px sans-serif; }
      #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 8px 12px; background: #1f1a15; border-bottom: 1px solid #3a3027; box-sizing: border-box; z-index: 1; }
      #bar b { color: #e8c47a; }
      #bar .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; width: 100%; }
      #bar .group { display: flex; align-items: center; gap: 3px; }
      #bar .group > span { color: #9c8c74; font-size: 12px; margin-right: 3px; }
      #bar button, #bar select { padding: 4px 9px; font: 13px sans-serif; color: #d8cbb4; background: #2a231d; border: 1px solid #5a4c3e; border-radius: 3px; cursor: pointer; }
      #bar button:hover { border-color: #a8875a; }
      #bar button.on { background: #5a4630; color: #ffe3a8; border-color: #a8875a; }
      #view { position: fixed; left: 0; bottom: 0; }
      #list { position: fixed; right: 0; bottom: 0; width: 210px; overflow-y: auto; padding: 6px 10px 20px; box-sizing: border-box; background: #1b1713; border-left: 1px solid #3a3027; font-size: 13px; }
      #list h3 { margin: 4px 0 6px; font-size: 13px; color: #e8c47a; }
      #list h4 { margin: 10px 0 3px; font-size: 12px; color: #9c8c74; font-weight: normal; }
      #list .item { padding: 2px 6px; border-radius: 3px; cursor: pointer; }
      #list .item.legendary { color: #ff9a3a; }
      #list .item.mythic { color: #ff4a4a; }
      #list .item:hover { background: #2a231d; }
      #list .item.on { background: #5a4630; }
      #list .item.none { opacity: 0.45; cursor: default; }
      #status { position: fixed; left: 12px; bottom: 10px; color: #9c8c74; font-size: 13px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <canvas id="view"></canvas>
    <div id="list"></div>
    <div id="status"></div>
    <script type="module" src="/src/tools/weaponViewer.ts"></script>
  </body>
</html>
