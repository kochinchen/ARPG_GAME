<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>技能特效 Review</title>
<style>
:root { --bg:#14110d; --card:#1f1a15; --line:#3a3027; --text:#d8cbb4; --dim:#9c8c74; --gold:#e8c47a; --warn:#ff9a6a; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.6 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
header { position:sticky; top:0; z-index:2; background:#1a1611ee; border-bottom:1px solid var(--line); padding:10px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
header h1 { margin:0; font-size:18px; color:var(--gold); }
header .hint { color:var(--dim); font-size:12px; flex:1 1 260px; }
button { font:inherit; color:var(--text); background:#2a231d; border:1px solid #5a4c3e; padding:4px 12px; cursor:pointer; border-radius:4px; }
button:hover { background:#3a3027; }
main { padding:16px; max-width:1500px; margin:0 auto; }
h2 { color:var(--gold); font-size:16px; margin:24px 0 4px; border-bottom:1px solid var(--line); padding-bottom:4px; }
h2 small { color:var(--dim); font-weight:normal; font-size:12px; margin-left:8px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(330px, 1fr)); gap:12px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:6px; overflow:hidden; display:flex; flex-direction:column; }
.card img { width:100%; aspect-ratio:560/400; display:block; background:#0d0b09; cursor:pointer; }
.meta { padding:8px 10px; display:flex; flex-direction:column; gap:4px; }
.title { display:flex; align-items:baseline; gap:8px; }
.title b { font-size:15px; }
.title code { color:var(--dim); font-size:11px; }
.title .grp { margin-left:auto; font-size:11px; color:var(--gold); border:1px solid #5a4c3e; border-radius:3px; padding:0 5px; }
.desc { color:var(--dim); font-size:12px; }
.known { color:var(--warn); font-size:12px; }
.bar { height:3px; background:#2a231d; } .bar i { display:block; height:100%; width:0; background:var(--gold); }
textarea { width:100%; min-height:44px; resize:vertical; background:#15120e; color:var(--text); border:1px solid var(--line); border-radius:4px; padding:4px 6px; font:inherit; font-size:13px; }
.ctrl { display:flex; gap:6px; align-items:center; font-size:12px; color:var(--dim); }
@media (max-width: 480px) { main { padding:16px 12px; } .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>技能特效 Review</h1>
  <span class="hint">每張圖每 0.1 秒一格、自動循環（點圖暫停 / 繼續）。現在的畫面：Three.js 畫法（光源、影子、光暈、火花）＋原本的 Pixi 特效圖樣。右上角的「第 N 組」是送給 ChatGPT 美化時的分組（一張圖最多 4 招）。意見寫在每招下面的框（存在這台電腦的瀏覽器），寫完按「複製全部意見」貼回對話。</span>
  <label class="ctrl">速度 <select id="speed"><option value="100">1×</option><option value="200">0.5×</option><option value="400">0.25×</option></select></label>
  <button id="copy">複製全部意見</button>
</header>
<main id="main"></main>
<script>
const DATA = [{"id": "melee.heavy_slash", "name": "重砍", "category": "melee", "description": "對單一目標由上往下重砍，適合作為 Finisher。", "frames": 13, "group": 1, "cat": "近戰", "known": ""}, {"id": "melee.quick_slash", "name": "快斬", "category": "melee", "description": "快速斬擊前方 80°。", "frames": 13, "group": 1, "cat": "近戰", "known": ""}, {"id": "melee.dash_slash", "name": "突進斬", "category": "melee", "description": "向前突進並斬擊路徑上的敵人，快速貼近目標，適合作為 Starter 或追擊技。", "frames": 14, "group": 1, "cat": "近戰", "known": ""}, {"id": "melee.armor_break", "name": "破甲斬", "category": "melee", "description": "向前方 110° 重擊並降低敵人防禦。", "frames": 13, "group": 1, "cat": "近戰", "known": ""}, {"id": "melee.shield_bash", "name": "盾擊", "category": "melee", "description": "以盾牌猛擊前方，產生衝擊波，暈眩並擊退敵人。傷害以盾牌本身的防禦計算，需要裝備盾牌。", "frames": 13, "group": 2, "cat": "近戰", "known": ""}, {"id": "melee.quake_slash", "name": "震地斬", "category": "melee", "description": "重擊地面產生衝擊波，傷害並震退附近敵人，適合打亂包圍與重新整理戰場。", "frames": 13, "group": 2, "cat": "近戰", "known": ""}, {"id": "melee.earth_break", "name": "裂地擊", "category": "melee", "description": "向前方 160° 釋放震波，並擊退敵人。", "frames": 13, "group": 2, "cat": "近戰", "known": ""}, {"id": "melee.blade_dance", "name": "劍刃旋舞", "category": "melee", "description": "捲起一股繞著身體旋轉的劍風，持續 3～7 秒，每秒對周圍敵人造成 30%～40% 武器傷害（隨技能等級增加）。", "frames": 37, "group": 2, "cat": "近戰", "known": ""}, {"id": "melee.launch_slash", "name": "挑空斬", "category": "melee", "description": "由下往上揮出強力斬擊，使敵人短暫浮空，適合作為 Combo Linker。", "frames": 13, "group": 3, "cat": "近戰", "known": ""}, {"id": "melee.devastator", "name": "毀滅重擊", "category": "melee", "description": "對單一目標從空中重劈，四周地面炸開；對破甲目標額外傷害。", "frames": 13, "group": 3, "cat": "近戰", "known": ""}, {"id": "melee.phantom_blades", "name": "幻影連斬", "category": "melee", "description": "快速連續五擊前方 80°。", "frames": 13, "group": 3, "cat": "近戰", "known": ""}, {"id": "melee.execution_slash", "name": "處決斬", "category": "melee", "description": "對前方目標施展重斬，敵人生命越低傷害越高，適合作為 Finisher。", "frames": 13, "group": 3, "cat": "近戰", "known": ""}, {"id": "ranged.quick_shot", "name": "快速射擊", "category": "ranged", "description": "快速單發。", "frames": 16, "group": 4, "cat": "遠程", "known": ""}, {"id": "ranged.piercing_shot", "name": "穿透箭", "category": "ranged", "description": "可穿透敵人。", "frames": 16, "group": 4, "cat": "遠程", "known": ""}, {"id": "ranged.backstep_shot", "name": "後跳射擊", "category": "ranged", "description": "向後跳躍並同時射擊前方目標，快速拉開距離，適合作為 Linker 或脫離近戰。", "frames": 16, "group": 4, "cat": "遠程", "known": ""}, {"id": "ranged.charge_shot", "name": "蓄力射擊", "category": "ranged", "description": "蓄力射出高傷重箭，並擊退敵人。", "frames": 18, "group": 4, "cat": "遠程", "known": ""}, {"id": "ranged.spread_shot", "name": "散射", "category": "ranged", "description": "扇形射出多支箭，等級越高角度越廣、箭數越多。", "frames": 16, "group": 5, "cat": "遠程", "known": ""}, {"id": "ranged.pinning_shot", "name": "牽制射擊", "category": "ranged", "description": "射出帶有牽制效果的箭矢，使敵人減速，方便拉開安全射擊距離。", "frames": 16, "group": 5, "cat": "遠程", "known": ""}, {"id": "ranged.weak_point", "name": "弱點射擊", "category": "ranged", "description": "標記敵人，提高其受到的暴擊傷害。", "frames": 16, "group": 5, "cat": "遠程", "known": ""}, {"id": "ranged.rapid_fire", "name": "連射", "category": "ranged", "description": "連續射擊五發。", "frames": 21, "group": 5, "cat": "遠程", "known": ""}, {"id": "ranged.explosive_arrow", "name": "爆裂箭", "category": "ranged", "description": "箭矢命中後爆炸，對目標與附近敵人造成範圍傷害，適合處理群體敵人。", "frames": 15, "group": 6, "cat": "遠程", "known": ""}, {"id": "ranged.execution_shot", "name": "狙殺", "category": "ranged", "description": "高傷攻擊；對 HP 低於 30% 的目標額外 +30% 傷害。", "frames": 19, "group": 6, "cat": "遠程", "known": ""}, {"id": "ranged.rain_of_arrows", "name": "箭雨", "category": "ranged", "description": "指定區域降下大量箭矢。", "frames": 30, "group": 6, "cat": "遠程", "known": ""}, {"id": "ranged.mark_shot", "name": "標記射擊", "category": "ranged", "description": "射擊並標記敵人的弱點，使後續攻擊對該目標造成更高傷害，適合作為 Boss 戰 Starter。", "frames": 16, "group": 6, "cat": "遠程", "known": ""}, {"id": "magic.fireball", "name": "火球", "category": "magic", "description": "火焰投射物，命中時產生小爆炸。", "frames": 18, "group": 7, "cat": "魔法", "known": ""}, {"id": "magic.ice_orb", "name": "冰球", "category": "magic", "description": "命中造成緩速。", "frames": 19, "group": 7, "cat": "魔法", "known": ""}, {"id": "magic.spark", "name": "電擊", "category": "magic", "description": "快速電擊，會自動小幅修正方向。", "frames": 15, "group": 7, "cat": "魔法", "known": ""}, {"id": "magic.flame_burst", "name": "火焰爆破", "category": "magic", "description": "中距離範圍爆炸；對燃燒中的目標額外 +30% 傷害。", "frames": 14, "group": 7, "cat": "魔法", "known": ""}, {"id": "magic.ice_lance", "name": "冰槍", "category": "magic", "description": "高速直線攻擊，可穿透 1 名敵人；對緩速中的敵人暴擊率 +25%。3 級起一次 2 支、5 級 3 支（扇形）。", "frames": 16, "group": 8, "cat": "魔法", "known": ""}, {"id": "magic.chain_lightning", "name": "連鎖閃電", "category": "magic", "description": "閃電在數名敵人之間跳躍（最多 3 次）。", "frames": 14, "group": 8, "cat": "魔法", "known": ""}, {"id": "magic.firewall", "name": "火牆", "category": "magic", "description": "在地面留下持續燃燒的火焰（4 秒，每秒傷害）。", "frames": 39, "group": 8, "cat": "魔法", "known": ""}, {"id": "magic.frost_nova", "name": "冰霜新星", "category": "magic", "description": "射出一顆在地上滾的巨大冰球，撞到牆壁或敵人（或滾完 12 格）時炸開：周圍範圍傷害並緩速，有機率冰凍敵人。", "frames": 23, "group": 8, "cat": "魔法", "known": ""}, {"id": "magic.thunder_strike", "name": "雷擊", "category": "magic", "description": "指定位置降下高傷落雷。", "frames": 17, "group": 9, "cat": "魔法", "known": ""}, {"id": "magic.meteor", "name": "隕星", "category": "magic", "description": "延遲後大範圍爆炸，並留下 3 秒火焰區（每秒 30%）。", "frames": 43, "group": 9, "cat": "魔法", "known": ""}, {"id": "magic.absolute_zero", "name": "絕對零度", "category": "magic", "description": "大範圍冰凍；Boss 改為強力緩速。冰柱留在地上 6～10 秒，範圍內的敵人持續緩速，並每秒受到 20%～40% 法術強度的冰寒傷害（隨技能等級增加）。", "frames": 39, "group": 9, "cat": "魔法", "known": ""}, {"id": "magic.storm_core", "name": "雷暴", "category": "magic", "description": "區域內連續六次落雷。", "frames": 35, "group": 9, "cat": "魔法", "known": ""}, {"id": "utility.roll", "name": "翻滾", "category": "utility", "description": "朝游標反方向後翻，翻滾期間免疫擊退。", "frames": 12, "group": 10, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.trip_net", "name": "絆索網", "category": "utility", "description": "在面前橫放一道 8 格寬的絆索網，碰到的敵人被絆倒（浮空）並緩速。被打壞或觸發次數用完就消失。", "frames": 10, "group": 10, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.poison_knife", "name": "淬毒飛刀", "category": "utility", "description": "直線擲出淬毒飛刀，命中使敵人中毒：5 秒內共 60%～200% 武器傷害（隨技能等級增加，最多 3 層）。近身時多把飛刀可以命中同一個敵人；可以當左鍵使用。", "frames": 15, "group": 10, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.shadow_step", "name": "影步", "category": "utility", "description": "向前穿越敵人，強化下一個近戰或遠程技能。", "frames": 12, "group": 10, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.frost_mine", "name": "霜凍地雷", "category": "utility", "description": "佈置霜凍地雷，0.8 秒後待命；敵人靠近或地雷被打壞時爆炸，範圍冰凍。", "frames": 21, "group": 11, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.frost_flask", "name": "霜凍瓶", "category": "utility", "description": "放下一座自動投射器，每 0.5 秒朝最近的敵人射出一支冰箭（10%～20% 武器冰寒傷害，隨技能等級增加），持續 20 秒。", "frames": 42, "group": 11, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.grapple_hook", "name": "鉤索", "category": "utility", "description": "擲出鉤索，把命中的敵人拉到面前。", "frames": 15, "group": 11, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.storm_totem", "name": "雷電圖騰", "category": "utility", "description": "豎起雷電圖騰，每秒朝最近的敵人射出一道穿透所有敵人的閃電（吃法術強度）。", "frames": 43, "group": 11, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.throwing_axe", "name": "擲斧", "category": "utility", "description": "扇形擲出飛斧，穿透敵人並造成流血：3 秒內共 60%～120% 武器傷害（物理、每秒結算、可暴擊、可疊加最多 5 層），適合掃過一排敵人。", "frames": 16, "group": 12, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.phantom_rush", "name": "幻影突襲", "category": "utility", "description": "穿越突進，路徑上的敵人全部受到傷害並暈眩。", "frames": 14, "group": 12, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.powder_keg", "name": "火藥桶", "category": "utility", "description": "放下火藥桶：被打壞或 10 秒後爆炸，範圍火焰傷害、擊退並燃燒。", "frames": 22, "group": 12, "cat": "道具 / 輔助", "known": ""}, {"id": "utility.flash_powder", "name": "閃光粉", "category": "utility", "description": "拋出閃光粉，落地範圍內的敵人抗性降低（弱化，直接相減、可以降到負數）。Lv4 起也降低物理抗性。冷卻 30 秒。", "frames": 16, "group": 12, "cat": "道具 / 輔助", "known": ""}];
const main = document.getElementById('main');
const store = (() => { try { return window.localStorage; } catch { return null; } })();
const key = (id) => 'fx-review:' + id;
let lastCat = '';
let grid = null;
const players = [];
for (const s of DATA) {
  if (s.cat !== lastCat) {
    lastCat = s.cat;
    const h = document.createElement('h2');
    h.innerHTML = s.cat + '<small>' + DATA.filter((x) => x.cat === s.cat).length + ' 招</small>';
    main.append(h);
    grid = document.createElement('div');
    grid.className = 'grid';
    main.append(grid);
  }
  const card = document.createElement('div');
  card.className = 'card';
  const img = document.createElement('img');
  img.alt = s.name;
  img.loading = 'lazy';
  const frames = Array.from({ length: s.frames }, (_, i) => 'review/' + s.id + '/' + String(i).padStart(2, '0') + '.jpg');
  img.src = frames[0];
  frames.forEach((f) => { const p = new Image(); p.src = f; });
  const bar = document.createElement('div');
  bar.className = 'bar';
  bar.innerHTML = '<i></i>';
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = '<div class="title"><b></b><code></code><span class="grp"></span></div><div class="desc"></div>' + (s.known ? '<div class="known"></div>' : '');
  meta.querySelector('b').textContent = s.name;
  meta.querySelector('code').textContent = s.id;
  meta.querySelector('.grp').textContent = '第 ' + s.group + ' 組';
  meta.querySelector('.desc').textContent = s.description;
  if (s.known) meta.querySelector('.known').textContent = '已知問題：' + s.known;
  const note = document.createElement('textarea');
  note.placeholder = '意見（例如：火焰要更高、爆炸要有煙、太快看不清楚…）';
  try { note.value = store?.getItem(key(s.id)) ?? ''; } catch {}
  note.addEventListener('input', () => { try { store?.setItem(key(s.id), note.value); } catch {} });
  meta.append(note);
  card.append(img, bar, meta);
  grid.append(card);
  const player = { s, img, bar: bar.firstChild, frames, i: 0, paused: false, note };
  img.addEventListener('click', () => (player.paused = !player.paused));
  players.push(player);
}
let timer = null;
const speed = document.getElementById('speed');
const run = () => {
  clearInterval(timer);
  timer = setInterval(() => {
    for (const p of players) {
      if (p.paused) continue;
      // 最後一格停久一點再重播
      p.i = (p.i + 1) % (p.frames.length + 6);
      const k = Math.min(p.i, p.frames.length - 1);
      p.img.src = p.frames[k];
      p.bar.style.width = ((k + 1) / p.frames.length) * 100 + '%';
    }
  }, Number(speed.value));
};
speed.addEventListener('change', run);
run();
document.getElementById('copy').addEventListener('click', async () => {
  const text = players.filter((p) => p.note.value.trim()).map((p) => '【' + p.s.name + '】' + p.note.value.trim()).join('\n');
  try { await navigator.clipboard.writeText(text || '（沒有意見）'); alert('已複製 ' + players.filter((p) => p.note.value.trim()).length + ' 招的意見'); }
  catch { prompt('複製下面的文字：', text); }
});
</script>
</body>
</html>
