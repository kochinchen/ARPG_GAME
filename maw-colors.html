<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>萬骸之口配色</title>
<style>
body{margin:0;background:#16130f;color:#e8e2d4;font-family:system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:#a89f8e;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
a{display:block;background:#221d17;border:1px solid #3a3226;border-radius:6px;overflow:hidden;color:inherit;text-decoration:none}
a:hover{border-color:#c9a24a}img{width:100%;display:block}b{display:block;padding:8px 10px;font-weight:500;font-size:14px}
</style></head><body>
<h1>萬骸之口：12 種配色</h1>
<p>開發用。第一屬性是眼睛與嘴裡，第二屬性是背脊與關節縫。點圖可以到魔王預覽頁看動作（那裡的選單也能換色）。圖由 art/monsters/bone_dragon/ai/preview/colors 提供。</p>
<div class="grid" id="grid"></div>
<script>
const N={fire:'火',cold:'冰',lightning:'雷',poison:'毒'};
for(const a in N)for(const b in N){if(a===b)continue;
const e=document.createElement('a');e.href=`/boss-viewer.html?model=bone_dragon&glow=${a},${b}`;
e.innerHTML=`<img src="/art/monsters/bone_dragon/ai/preview/colors/${a}-${b}.png" alt="${N[a]}＋${N[b]}"><b>嘴：${N[a]}　縫：${N[b]}</b>`;
document.getElementById('grid').append(e);}
</script></body></html>
